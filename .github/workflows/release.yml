name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        # The toolchain version comes from rune/rust-toolchain.toml.
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rune

      - name: Test
        env:
          MDAW_AUDIO: 'null'
        working-directory: rune
        run: cargo test --workspace --release --no-fail-fast

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          # A new keychain locks itself after 5 minutes: the release build that follows takes
          # longer, and codesign then waits for a password nobody can type (the v2.2.0 runs hung
          # there for an hour). Keep it unlocked for the whole job.
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P $MACOS_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          rm certificate.p12

      - name: Build and sign the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          MAC_APP_SIGN="$IDENTITY" rune/scripts/build-mac-app.sh

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd rune/dist
          ditto -c -k --keepParent "Micro DAW.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "Micro DAW.app"
          rm notarize.zip

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ZIP="Micro-DAW-${TAG#v}-mac-arm64.zip"
          cd rune/dist
          ditto -c -k --keepParent "Micro DAW.app" "$ZIP"
          gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" "$ZIP" --clobber
