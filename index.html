<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (works for the Vite dev server and the packaged file:// build):
      - scripts only from the app itself, plus blob: for Tone.js (AudioWorklet module + timing Web Worker).
        Vite's dev-only react-refresh preamble is injected above this tag, so it is not affected.
      - connect 'self' covers Vite's HMR websocket (same origin); the app talks to the network only via main.
      - inline styles: Tailwind/Vite style tags and React style attributes.
      - no plugins, frames, <base> or form posts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Micro DAW</title>
    <meta name="color-scheme" content="dark" />
    <style>html, body { margin: 0; background: #100e0c; }</style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React frame: same color as the Electron window and the StartScreen intro (no flash). -->
      <div id="splash" style="height: 100vh; background: #100e0c; -webkit-app-region: drag;"></div>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
