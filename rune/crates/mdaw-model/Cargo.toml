[package]
name = "mdaw-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "micro-daw data model, project format, migrations and pure helpers (no audio, no UI)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# Golden fixtures need correctly rounded float parsing (JSON.stringify round-trips exactly).
serde_json = { workspace = true, features = ["float_roundtrip"] }
