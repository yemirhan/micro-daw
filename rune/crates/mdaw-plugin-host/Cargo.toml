[package]
name = "mdaw-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "micro-daw plugin host: Audio Unit (v2) effects and instruments on macOS (scan, render, MIDI, state, editor window)"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# `disable-encoding-assertions`: debug builds otherwise check every message against the receiver's
# method signature, and plugin view classes override AppKit methods with signatures the check
# rejects (Guitar Rig's `-[NICocoaView setFrameOrigin:]`), which aborted the editor.
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
