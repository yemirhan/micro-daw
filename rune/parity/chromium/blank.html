<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Same CSP as index.html. No app boot: capture-page.ts is imported by the steps script, so
         nothing touches Tone.Noise (or Math.random) before the seeded noise buffer is drawn. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>micro-daw parity capture</title>
  </head>
  <body></body>
</html>
